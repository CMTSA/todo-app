<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todo App</title>
  <style>
    :root {
      --bg-page: #f0f2f5;
      --bg-container: #ffffff;
      --shadow-container: rgba(0, 0, 0, 0.1);
      --color-heading: #1a1a2e;
      --color-text: #333333;
      --color-text-muted: #aaaaaa;
      --border-input: #e0e0e0;
      --bg-todo-item: #f8f8ff;
      --border-todo-item: #e8e8f0;
      --bg-todo-completed: #f5f5f5;
      --border-todo-completed: #e0e0e0;
      --color-text-completed: #aaaaaa;
      --bg-delete-hover: #ffeaea;
      --color-delete-hover: #990000;
    }

    :root[data-theme="dark"] {
      --bg-page: #0f1117;
      --bg-container: #1e2130;
      --shadow-container: rgba(0, 0, 0, 0.4);
      --color-heading: #e8e8f0;
      --color-text: #d0d0e0;
      --color-text-muted: #666680;
      --border-input: #3a3d50;
      --bg-todo-item: #262a3d;
      --border-todo-item: #3a3d50;
      --bg-todo-completed: #1e2130;
      --border-todo-completed: #2e3145;
      --color-text-completed: #555570;
      --bg-delete-hover: #3d1e1e;
      --color-delete-hover: #ff6b6b;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg-page);
      display: flex;
      justify-content: center;
      padding: 60px 16px;
      min-height: 100vh;
      transition: background 0.3s;
    }

    .container {
      background: var(--bg-container);
      border-radius: 12px;
      box-shadow: 0 4px 20px var(--shadow-container);
      padding: 32px;
      width: 100%;
      max-width: 480px;
      height: fit-content;
      transition: background 0.3s, box-shadow 0.3s;
    }

    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }

    h1 {
      font-size: 1.8rem;
      color: var(--color-heading);
      transition: color 0.3s;
    }

    #theme-toggle {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1.4rem;
      padding: 4px 6px;
      border-radius: 6px;
      line-height: 1;
      transition: background 0.2s;
    }

    #theme-toggle:hover {
      background: var(--border-input);
    }

    .input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
    }

    #todo-input {
      flex: 1;
      padding: 10px 14px;
      border: 2px solid var(--border-input);
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
      background: var(--bg-container);
      color: var(--color-text);
      transition: border-color 0.2s, background 0.3s, color 0.3s;
    }

    #todo-input:focus {
      border-color: #6c63ff;
    }

    #todo-input::placeholder {
      color: var(--color-text-muted);
    }

    #add-btn {
      padding: 10px 18px;
      background: #6c63ff;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
      white-space: nowrap;
    }

    #add-btn:hover {
      background: #574fd6;
    }

    #todo-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .todo-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg-todo-item);
      border: 1px solid var(--border-todo-item);
      border-radius: 8px;
      padding: 12px 14px;
      gap: 12px;
      transition: background 0.3s, border-color 0.3s;
    }

    .todo-text {
      flex: 1;
      font-size: 1rem;
      color: var(--color-text);
      word-break: break-word;
      cursor: pointer;
      user-select: none;
      transition: color 0.2s, text-decoration 0.2s;
    }

    .todo-item.completed .todo-text {
      text-decoration: line-through;
      color: var(--color-text-completed);
    }

    .todo-item.completed {
      background: var(--bg-todo-completed);
      border-color: var(--border-todo-completed);
    }

    .delete-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: #cc0000;
      font-size: 1.1rem;
      padding: 4px 8px;
      border-radius: 6px;
      transition: background 0.2s, color 0.2s;
      flex-shrink: 0;
    }

    .delete-btn:hover {
      background: var(--bg-delete-hover);
      color: var(--color-delete-hover);
    }

    .empty-msg {
      text-align: center;
      color: var(--color-text-muted);
      font-size: 0.95rem;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header-row">
      <h1>Todo List</h1>
      <button id="theme-toggle" aria-label="Toggle theme">🌙</button>
    </div>
    <div class="input-row">
      <input
        type="text"
        id="todo-input"
        placeholder="Add a new todo..."
        maxlength="200"
        autocomplete="off"
      />
      <button id="add-btn">Add</button>
    </div>
    <ul id="todo-list"></ul>
    <p class="empty-msg" id="empty-msg">No todos yet. Add one above!</p>
  </div>

  <script>
    const input = document.getElementById('todo-input');
    const addBtn = document.getElementById('add-btn');
    const list = document.getElementById('todo-list');
    const emptyMsg = document.getElementById('empty-msg');
    const themeToggle = document.getElementById('theme-toggle');

    // Theme persistence
    const savedTheme = localStorage.getItem('theme') || 'light';
    document.documentElement.dataset.theme = savedTheme;
    themeToggle.textContent = savedTheme === 'dark' ? '☀️' : '🌙';

    themeToggle.addEventListener('click', () => {
      const current = document.documentElement.dataset.theme;
      const next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.dataset.theme = next;
      localStorage.setItem('theme', next);
      themeToggle.textContent = next === 'dark' ? '☀️' : '🌙';
    });

    function updateEmptyMessage() {
      emptyMsg.style.display = list.children.length === 0 ? 'block' : 'none';
    }

    function addTodo() {
      const text = input.value.trim();
      if (!text) return;

      const li = document.createElement('li');
      li.className = 'todo-item';

      const span = document.createElement('span');
      span.className = 'todo-text';
      span.textContent = text;
      span.setAttribute('title', 'Click to toggle complete');
      span.addEventListener('click', () => {
        li.classList.toggle('completed');
      });

      const deleteBtn = document.createElement('button');
      deleteBtn.className = 'delete-btn';
      deleteBtn.textContent = '✕';
      deleteBtn.setAttribute('aria-label', 'Delete todo');
      deleteBtn.addEventListener('click', () => {
        li.remove();
        updateEmptyMessage();
      });

      li.appendChild(span);
      li.appendChild(deleteBtn);
      list.appendChild(li);

      input.value = '';
      input.focus();
      updateEmptyMessage();
    }

    addBtn.addEventListener('click', addTodo);

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') addTodo();
    });

    updateEmptyMessage();
  </script>
</body>
</html>
