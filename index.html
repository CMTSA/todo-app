<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todo App</title>
  <style>
    :root {
      --bg-page-start: #eef2ff;
      --bg-page-end: #f8fafc;
      --bg-container: rgba(255, 255, 255, 0.92);
      --border-container: rgba(108, 99, 255, 0.16);
      --shadow-container: rgba(77, 73, 171, 0.18);
      --color-heading: #171a2e;
      --color-text: #30344a;
      --color-text-muted: #78809b;
      --border-input: #d8ddf2;
      --bg-todo-item: #f5f7ff;
      --border-todo-item: #e3e8fd;
      --bg-todo-completed: #edf0fb;
      --border-todo-completed: #dae0f6;
      --color-text-completed: #8e95b0;
      --bg-delete-hover: #ffecef;
      --color-delete-hover: #b3263d;
      --accent: #6c63ff;
      --accent-strong: #5147f2;
      --focus-ring: rgba(108, 99, 255, 0.28);
    }

    :root[data-theme="dark"] {
      --bg-page-start: #0c1020;
      --bg-page-end: #171c34;
      --bg-container: rgba(24, 30, 54, 0.94);
      --border-container: rgba(134, 145, 255, 0.24);
      --shadow-container: rgba(3, 8, 24, 0.5);
      --color-heading: #edf0ff;
      --color-text: #d9e0ff;
      --color-text-muted: #8890b4;
      --border-input: #3a4368;
      --bg-todo-item: #222a49;
      --border-todo-item: #33406b;
      --bg-todo-completed: #1d2441;
      --border-todo-completed: #2d365d;
      --color-text-completed: #8089af;
      --bg-delete-hover: #422333;
      --color-delete-hover: #ff88a0;
      --accent: #8a84ff;
      --accent-strong: #736cf4;
      --focus-ring: rgba(138, 132, 255, 0.34);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(145deg, var(--bg-page-start), var(--bg-page-end));
      display: flex;
      justify-content: center;
      padding: 72px 18px;
      min-height: 100vh;
      transition: background 0.35s ease;
    }

    .container {
      background: var(--bg-container);
      border: 1px solid var(--border-container);
      border-radius: 18px;
      box-shadow: 0 20px 44px -24px var(--shadow-container);
      padding: 32px 30px;
      width: 100%;
      max-width: 520px;
      height: fit-content;
      backdrop-filter: blur(8px);
      transition: background 0.35s ease, box-shadow 0.35s ease, border-color 0.35s ease;
    }

    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }

    h1 {
      font-size: 2rem;
      letter-spacing: -0.03em;
      color: var(--color-heading);
      transition: color 0.35s ease;
    }

    #theme-toggle {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1.4rem;
      padding: 6px 8px;
      border-radius: 10px;
      line-height: 1;
      transition: background 0.2s ease, transform 0.2s ease;
    }

    #theme-toggle:hover {
      background: var(--border-input);
      transform: translateY(-1px);
    }

    .input-row {
      display: flex;
      gap: 10px;
      margin-bottom: 24px;
    }

    #todo-input {
      flex: 1;
      padding: 12px 14px;
      border: 1px solid var(--border-input);
      border-radius: 12px;
      font-size: 1rem;
      outline: none;
      background: var(--bg-container);
      color: var(--color-text);
      transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.35s ease, color 0.35s ease;
    }

    #todo-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px var(--focus-ring);
    }

    #todo-input::placeholder {
      color: var(--color-text-muted);
    }

    #add-btn {
      padding: 12px 20px;
      background: linear-gradient(135deg, var(--accent), var(--accent-strong));
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.16s ease, box-shadow 0.16s ease, filter 0.16s ease;
      white-space: nowrap;
      box-shadow: 0 12px 20px -16px var(--accent);
    }

    #add-btn:hover {
      filter: brightness(1.05);
      transform: translateY(-1px);
      box-shadow: 0 16px 28px -18px var(--accent);
    }

    #add-btn:active {
      transform: translateY(0);
    }

    #todo-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .todo-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg-todo-item);
      border: 1px solid var(--border-todo-item);
      border-radius: 8px;
      padding: 13px 14px;
      gap: 12px;
      transition: transform 0.22s ease, background 0.35s ease, border-color 0.35s ease;
      animation: item-enter 0.26s ease both;
    }

    .todo-item:hover {
      transform: translateY(-1px);
    }

    .todo-text {
      flex: 1;
      font-size: 1rem;
      color: var(--color-text);
      word-break: break-word;
      cursor: pointer;
      user-select: none;
      transition: color 0.22s ease, text-decoration 0.22s ease;
    }

    .todo-item.completed .todo-text {
      text-decoration: line-through;
      color: var(--color-text-completed);
    }

    .todo-item.completed {
      background: var(--bg-todo-completed);
      border-color: var(--border-todo-completed);
    }

    .delete-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: #cc0000;
      font-size: 1rem;
      padding: 4px 8px;
      border-radius: 8px;
      transition: background 0.2s ease, color 0.2s ease, transform 0.2s ease;
      flex-shrink: 0;
    }

    .delete-btn:hover {
      background: var(--bg-delete-hover);
      color: var(--color-delete-hover);
      transform: scale(1.05);
    }

    .empty-msg {
      text-align: center;
      color: var(--color-text-muted);
      font-size: 0.95rem;
      margin-top: 8px;
      animation: fade-in 0.24s ease;
    }

    @keyframes item-enter {
      from {
        opacity: 0;
        transform: translateY(8px) scale(0.99);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes fade-in {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header-row">
      <h1>Todo List</h1>
      <button id="theme-toggle" aria-label="Toggle theme">🌙</button>
    </div>
    <div class="input-row">
      <input
        type="text"
        id="todo-input"
        placeholder="Add a new todo..."
        maxlength="200"
        autocomplete="off"
      />
      <button id="add-btn">Add</button>
    </div>
    <ul id="todo-list"></ul>
    <p class="empty-msg" id="empty-msg">No todos yet. Add one above!</p>
  </div>

  <script>
    const input = document.getElementById('todo-input');
    const addBtn = document.getElementById('add-btn');
    const list = document.getElementById('todo-list');
    const emptyMsg = document.getElementById('empty-msg');
    const themeToggle = document.getElementById('theme-toggle');

    // Theme persistence
    const savedTheme = localStorage.getItem('theme') || 'light';
    document.documentElement.dataset.theme = savedTheme;
    themeToggle.textContent = savedTheme === 'dark' ? '☀️' : '🌙';

    themeToggle.addEventListener('click', () => {
      const current = document.documentElement.dataset.theme;
      const next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.dataset.theme = next;
      localStorage.setItem('theme', next);
      themeToggle.textContent = next === 'dark' ? '☀️' : '🌙';
    });

    function updateEmptyMessage() {
      emptyMsg.style.display = list.children.length === 0 ? 'block' : 'none';
    }

    function addTodo() {
      const text = input.value.trim();
      if (!text) return;

      const li = document.createElement('li');
      li.className = 'todo-item';

      const span = document.createElement('span');
      span.className = 'todo-text';
      span.textContent = text;
      span.setAttribute('title', 'Click to toggle complete');
      span.addEventListener('click', () => {
        li.classList.toggle('completed');
      });

      const deleteBtn = document.createElement('button');
      deleteBtn.className = 'delete-btn';
      deleteBtn.textContent = '✕';
      deleteBtn.setAttribute('aria-label', 'Delete todo');
      deleteBtn.addEventListener('click', () => {
        li.remove();
        updateEmptyMessage();
      });

      li.appendChild(span);
      li.appendChild(deleteBtn);
      list.appendChild(li);

      input.value = '';
      input.focus();
      updateEmptyMessage();
    }

    addBtn.addEventListener('click', addTodo);

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') addTodo();
    });

    updateEmptyMessage();
  </script>
</body>
</html>
